# ==========================================================================
#  Fiery Hold Sender - configuration
#  Relative paths are resolved against the folder containing this file.
#  Backslashes in Windows paths must be doubled (C:\\HotFolder) or use / .
# ==========================================================================

# ---------- Hot folder ----------
# Files dropped here trigger the job popup.
watch.folder=C:/FieryHotFolder
# Only these extensions are picked up (the sender supports PDF, PostScript and JPEG).
watch.extensions=pdf,ps,jpg,jpeg
# How often the folder is scanned, and how long a file's size must stay unchanged
# (and the file be unlocked) before it is considered completely copied.
watch.poll.millis=1000
watch.settle.millis=2000

# After a file is verified on the Fiery it is deleted from the hot folder.
# Set an archive folder to move it there instead (leave blank to delete).
archive.folder=

# ---------- Fiery ----------
fiery.host=192.168.1.104
# LPR = LPD protocol on port 515 to the named queue (recommended: every step is acknowledged by the Fiery)
# RAW = port 9100 (goes to whatever queue the Fiery has configured for port 9100)
fiery.method=LPR
fiery.queue=hold
fiery.port=515
fiery.connect.timeout.seconds=10
# Max wait for the Fiery to acknowledge a block of data (large files need more).
fiery.ack.timeout.seconds=120

# ---------- Sending ----------
powershell.exe=powershell.exe
send.script=../scripts/Send-ToFieryHold.ps1
# Overall time limit for one file, including retries inside the script.
send.timeout.seconds=600
# Extra attempts after a failed send.
send.retries=2
send.retry.delay.seconds=5

# ---------- Logs ----------
log.folder=../logs

# ---------- Popup form ----------
# Media dropdown: media.N.label is shown to the user, media.N.pjl are the PJL lines added to the
# job header (several lines separated by |). Use the PJL / PPD keys of YOUR Fiery model; check them
# in Command WorkStation > Job Properties or the Fiery PJL reference. Leave pjl blank for "no change".
media.1.label=Default (Fiery setting)
media.1.pjl=
media.2.label=Plain 80gsm
media.2.pjl=@PJL SET MEDIATYPE=PLAIN
media.3.label=Gloss 150gsm
media.3.pjl=@PJL SET MEDIATYPE=GLOSSY
media.4.label=Card 300gsm
media.4.pjl=@PJL SET MEDIATYPE=CARDSTOCK

finishing.1.label=None
finishing.1.pjl=
finishing.2.label=Staple top-left
finishing.2.pjl=@PJL SET STAPLE=TOPLEFT
finishing.3.label=Duplex (long edge)
finishing.3.pjl=@PJL SET DUPLEX=ON|@PJL SET BINDING=LONGEDGE
finishing.4.label=Hole punch
finishing.4.pjl=@PJL SET PUNCH=ON

# PJL templates for the free-form fields. {value} is replaced with the (sanitised) entered value.
# Blank = the field is only written to the log / job name.
pjl.copies=@PJL SET COPIES={value}|@PJL SET QTY={value}
pjl.customer=@PJL COMMENT CUSTOMER="{value}"
pjl.instructions=@PJL COMMENT INSTRUCTIONS="{value}"

# Test print forces 1 copy and prefixes the job name so it is easy to spot in the Hold queue.
testprint.prefix=TEST_
# Job name sent to the Fiery: {customer} and {file} are replaced. Example: {customer}_{file}
jobname.pattern={file}
